<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="#101318" />

    <!-- Bold circular arc ring, gap at top-right -->
    <circle
      cx="256"
      cy="256"
      r="160"
      fill="none"
      stroke="#25e087"
      stroke-width="42"
      stroke-linecap="round"
      stroke-dasharray="905 110"
      transform="rotate(-45 256 256)"
    />

    <!-- Small inner dot -->
    <circle cx="256" cy="256" r="30" fill="#25e087" />
  </g>
</svg>
