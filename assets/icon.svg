<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Deep matte black background -->
    <rect x="0" y="0" width="1024" height="1024" fill="#0b0e14" />

    <!-- Bold white ring -->
    <circle
      cx="512"
      cy="512"
      r="320"
      fill="none"
      stroke="#ffffff"
      stroke-width="123"
    />

    <!-- Short green arc segment overlapping the ring, top-right -->
    <circle
      cx="512"
      cy="512"
      r="320"
      fill="none"
      stroke="#3ddc84"
      stroke-width="123"
      stroke-linecap="round"
      stroke-dasharray="391 1620"
      transform="rotate(-80 512 512)"
    />

    <!-- Small green center dot -->
    <circle cx="512" cy="512" r="62" fill="#3ddc84" />
  </g>
</svg>
