<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Near-black background -->
    <rect x="0" y="0" width="1024" height="1024" fill="#0a0a0c" />

    <!-- Thin white ring -->
    <circle cx="512" cy="512" r="317.5" fill="none" stroke="#ffffff" stroke-width="36" />

    <!-- White "W" monogram: two V shapes sharing a midpoint -->
    <polyline
      points="337,357 424.5,667 512,357 599.5,667 687,357"
      fill="none"
      stroke="#ffffff"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Small green plus accent, top-right, outside the ring -->
    <g stroke="#3ddc84" stroke-width="36" stroke-linecap="round">
      <line x1="798.7" y1="163.8" x2="798.7" y2="286.8" />
      <line x1="737.2" y1="225.3" x2="860.2" y2="225.3" />
    </g>
  </g>
</svg>
